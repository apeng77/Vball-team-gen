<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Team Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button.danger {
      background: #dc2626;
    }

    button.secondary {
      background: #374151;
    }

    button.small-danger {
      background: #ef4444;
      width: auto;
      padding: 6px 10px;
      margin: 0;
      font-size: 13px;
    }

    button.small-edit {
      background: #2563eb;
      width: auto;
      padding: 6px 10px;
      margin: 0;
      font-size: 13px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .overall-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-weight: bold;
    }

    .player {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
      margin-top: 3px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .team {
      background: #f9fafb;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }


    .sync-status {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 14px;
    }

    .sync-status.offline {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #9a3412;
    }

    
.sync-dot {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #f97316;
  box-shadow: 0 0 6px rgba(0,0,0,0.2);
  z-index: 9999;
}
.sync-dot.connected { background: #22c55e; }
.sync-dot.error { background: #ef4444; }

@media (max-width: 700px) {
      .grid, .grid-3, .teams {
        grid-template-columns: 1fr;
      }

      .player {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
      <h1>Volleyball Team Generator</h1>
      <p>Add player stats, save your group, edit players, and generate balanced teams.</p>
      <div id="syncDot" class="sync-dot"></div>
    </div>

    <div class="card">
      <h2 id="formTitle">Add Player</h2>

      <div class="grid">
        <div>
          <label>Player Name</label>
          <input id="name" placeholder="Example: Andy" />
        </div>

        <div>
          <label>Auto Role</label>
          <div class="overall-box" style="margin-top:6px;">
            <span id="rolePreview">All-around</span>
          </div>
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label>Hitting</label>
          <input id="hitting" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>

        <div>
          <label>Setting</label>
          <input id="setting" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>

        <div>
          <label>Defense</label>
          <input id="defense" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label>Serving</label>
          <input id="serving" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>

        <div>
          <label>Serve Receive</label>
          <input id="serveReceive" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>

        <div>
          <label>Blocking</label>
          <input id="blocking" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Athleticism / Movement</label>
          <input id="athleticism" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>

        <div>
          <label>Consistency</label>
          <input id="consistency" type="number" min="1" max="10" value="5" oninput="updateOverallPreview()" />
        </div>
      </div>

      <div class="overall-box">
        Auto Overall: <span id="overallPreview">5.0</span>
      </div>

      <button id="saveButton" onclick="savePlayerFromForm()">Add Player</button>
      <button id="cancelEditButton" class="secondary" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>
      <button class="danger" onclick="clearPlayers()">Clear Saved Players</button>
    </div>

    <div class="card">
      <h2>Saved Players</h2>
      <div id="players"></div>
    </div>

    <div class="card">
      <h2>Generate Teams</h2>

      <div class="grid">
        <div>
          <label>System / Format</label>
          <select id="system">
            <option value="4-2">4-2</option>
            <option value="5-1">5-1</option>
            <option value="6-2">6-2</option>
            <option value="casual">Casual Balanced</option>
            <option value="doubles">Doubles</option>
            <option value="trios">Trios</option>
            <option value="quads">Quads</option>
          </select>
        </div>

        <div>
          <label>Number of Teams</label>
          <select id="teamCount">
            <option value="2">2 Teams</option>
            <option value="3">3 Teams</option>
            <option value="4">4 Teams</option>
          </select>
        </div>
      </div>

      <button onclick="generateTeams()">Generate Teams</button>
    </div>

    <div class="card">
      <h2>Teams</h2>
      <div id="warnings"></div>
      <div id="teams" class="teams"></div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3aahw4LYvNdQVekOBJPTOxiX80_1MOeE",
      authDomain: "vball-team-gen.firebaseapp.com",
      databaseURL: "https://vball-team-gen-default-rtdb.firebaseio.com",
      projectId: "vball-team-gen",
      storageBucket: "vball-team-gen.firebasestorage.app",
      messagingSenderId: "501689612905",
      appId: "1:501689612905:web:5352bc6bc0bef8b49140f8",
      measurementId: "G-LN4MSE1856"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, "volleyballTeamGenerator/main-group/players");

    let players = [];
    let editingPlayerId = null;
    let firebaseLoaded = false;
    let syncingFromFirebase = false;

    function setSyncStatus(_, connected = false, error = false) {
      const dot = document.getElementById("syncDot");
      if (!dot) return;
      dot.classList.remove("connected", "error");
      if (error) {
        dot.classList.add("error");
      } else if (connected) {
        dot.classList.add("connected");
      }
    }

    onValue(playersRef, (snapshot) => {
      syncingFromFirebase = true;
      players = snapshot.val() || [];
      firebaseLoaded = true;
      migrateOldPlayers(false);
      updateOverallPreview();
      renderPlayers();
      setSyncStatus("", true);
      syncingFromFirebase = false;
    }, (error) => {
      console.error(error);
      players = JSON.parse(localStorage.getItem("volleyballPlayers")) || [];
      firebaseLoaded = false;
      migrateOldPlayers(false);
      updateOverallPreview();
      renderPlayers();
      setSyncStatus("", false, true);
    });


    function migrateOldPlayers(shouldSave = true) {
      players = players.map(player => {
        const hitting = Number(player.hitting ?? player.overall ?? 5);
        const setting = Number(player.setting ?? player.overall ?? 5);
        const defense = Number(player.defense ?? player.overall ?? 5);
        const serving = Number(player.serving ?? player.overall ?? 5);
        const serveReceive = Number(player.serveReceive ?? player.defense ?? player.overall ?? 5);
        const blocking = Number(player.blocking ?? player.overall ?? 5);
        const athleticism = Number(player.athleticism ?? player.overall ?? 5);
        const consistency = Number(player.consistency ?? player.overall ?? 5);
        const overall = calculateOverallFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency);

        const role = detectAutoRoleFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency);

        return {
          ...player,
          role,
          hitting,
          setting,
          defense,
          serving,
          serveReceive,
          blocking,
          athleticism,
          consistency,
          overall
        };
      });

      if (shouldSave) savePlayers();
    }

    function savePlayers() {
      if (syncingFromFirebase) return;

      localStorage.setItem("volleyballPlayers", JSON.stringify(players));

      if (firebaseLoaded) {
        set(playersRef, players).catch((error) => {
          console.error(error);
          alert("Firebase save failed. Check your Realtime Database rules.");
          setSyncStatus("", false, true);
        });
      }
    }

    function statValue(id) {
      const value = Number(document.getElementById(id).value);
      if (!value) return 5;
      return Math.min(10, Math.max(1, value));
    }

    function calculateOverallFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency) {
      return (
        hitting * 0.19 +
        setting * 0.16 +
        defense * 0.17 +
        serving * 0.10 +
        serveReceive * 0.16 +
        blocking * 0.12 +
        athleticism * 0.05 +
        consistency * 0.05
      );
    }

    function detectAutoRoleFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency) {
      const maxStat = Math.max(hitting, setting, defense, serveReceive, blocking);
      const closeToMax = (value) => value >= maxStat - 1;

      if (setting >= 8 && closeToMax(setting)) return "Setter";
      if (hitting >= 8 && blocking >= 7) return "Hitter / Blocker";
      if (blocking >= 8 && closeToMax(blocking)) return "Blocker";
      if ((defense >= 8 || serveReceive >= 8) && (closeToMax(defense) || closeToMax(serveReceive))) return "Defense / Passer";
      if (hitting >= 8 && closeToMax(hitting)) return "Hitter";

      const strongStats = [hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency].filter(stat => stat >= 7).length;
      if (strongStats >= 4) return "All-around";

      if (setting === maxStat) return "Setter";
      if (hitting === maxStat) return "Hitter";
      if (blocking === maxStat) return "Blocker";
      if (defense === maxStat || serveReceive === maxStat) return "Defense / Passer";
      return "All-around";
    }

    function detectAutoRole(player) {
      return detectAutoRoleFromStats(
        Number(player.hitting ?? 5),
        Number(player.setting ?? 5),
        Number(player.defense ?? 5),
        Number(player.serving ?? 5),
        Number(player.serveReceive ?? 5),
        Number(player.blocking ?? 5),
        Number(player.athleticism ?? 5),
        Number(player.consistency ?? 5)
      );
    }

    function currentOverall() {
      return calculateOverallFromStats(
        statValue("hitting"),
        statValue("setting"),
        statValue("defense"),
        statValue("serving"),
        statValue("serveReceive"),
        statValue("blocking"),
        statValue("athleticism"),
        statValue("consistency")
      );
    }

    function updateOverallPreview() {
      document.getElementById("overallPreview").textContent = currentOverall().toFixed(1);
      const rolePreview = document.getElementById("rolePreview");
      if (rolePreview) {
        rolePreview.textContent = detectAutoRoleFromStats(
          statValue("hitting"),
          statValue("setting"),
          statValue("defense"),
          statValue("serving"),
          statValue("serveReceive"),
          statValue("blocking"),
          statValue("athleticism"),
          statValue("consistency")
        );
      }
    }

    function savePlayerFromForm() {
      const name = document.getElementById("name").value.trim();
      if (!name) {
        alert("Enter a player name.");
        return;
      }

      const hitting = statValue("hitting");
      const setting = statValue("setting");
      const defense = statValue("defense");
      const serving = statValue("serving");
      const serveReceive = statValue("serveReceive");
      const blocking = statValue("blocking");
      const athleticism = statValue("athleticism");
      const consistency = statValue("consistency");
      const overall = calculateOverallFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency);
      const role = detectAutoRoleFromStats(hitting, setting, defense, serving, serveReceive, blocking, athleticism, consistency);

      const playerData = {
        name,
        role,
        hitting,
        setting,
        defense,
        serving,
        serveReceive,
        blocking,
        athleticism,
        consistency,
        overall
      };

      if (editingPlayerId) {
        players = players.map(player => {
          if (player.id === editingPlayerId) {
            return { ...player, ...playerData };
          }
          return player;
        });
      } else {
        players.push({
          id: Date.now(),
          ...playerData
        });
      }

      savePlayers();
      resetForm();
      renderPlayers();
    }

    function editPlayer(id) {
      const player = players.find(p => p.id === id);
      if (!player) return;

      editingPlayerId = id;

      document.getElementById("formTitle").textContent = "Edit Player";
      document.getElementById("saveButton").textContent = "Save Changes";
      document.getElementById("cancelEditButton").style.display = "block";

      document.getElementById("name").value = player.name;
      document.getElementById("hitting").value = player.hitting;
      document.getElementById("setting").value = player.setting;
      document.getElementById("defense").value = player.defense;
      document.getElementById("serving").value = player.serving;
      document.getElementById("serveReceive").value = player.serveReceive;
      document.getElementById("blocking").value = player.blocking;
      document.getElementById("athleticism").value = player.athleticism;
      document.getElementById("consistency").value = player.consistency;

      updateOverallPreview();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function cancelEdit() {
      resetForm();
    }

    function resetForm() {
      editingPlayerId = null;

      document.getElementById("formTitle").textContent = "Add Player";
      document.getElementById("saveButton").textContent = "Add Player";
      document.getElementById("cancelEditButton").style.display = "none";

      document.getElementById("name").value = "";
      document.getElementById("hitting").value = 5;
      document.getElementById("setting").value = 5;
      document.getElementById("defense").value = 5;
      document.getElementById("serving").value = 5;
      document.getElementById("serveReceive").value = 5;
      document.getElementById("blocking").value = 5;
      document.getElementById("athleticism").value = 5;
      document.getElementById("consistency").value = 5;

      updateOverallPreview();
    }

    function removePlayer(id) {
      if (!confirm("Remove this player?")) return;
      players = players.filter(player => player.id !== id);
      savePlayers();
      renderPlayers();

      if (editingPlayerId === id) {
        resetForm();
      }
    }

    function clearPlayers() {
      if (!confirm("Clear all saved players?")) return;
      players = [];
      savePlayers();
      renderPlayers();
      resetForm();
      document.getElementById("teams").innerHTML = "";
      document.getElementById("warnings").innerHTML = "";
    }

    function renderPlayers() {
      const box = document.getElementById("players");

      if (players.length === 0) {
        box.innerHTML = "<p>No saved players yet.</p>";
        return;
      }

      box.innerHTML = players.map(player => {
        const autoRole = detectAutoRole(player);

        return `
        <div class="player">
          <div>
            <strong>${player.name}</strong> — ${autoRole}
            <div class="small">
              Hit ${player.hitting} | Set ${player.setting} | Def ${player.defense} | Serve ${player.serving} | Receive ${player.serveReceive} | Block ${player.blocking} | Ath ${player.athleticism} | Cons ${player.consistency} | Overall ${Number(player.overall).toFixed(1)}
            </div>
          </div>
          <div class="button-row">
            <button class="small-edit" onclick="editPlayer(${player.id})">Edit</button>
            <button class="small-danger" onclick="removePlayer(${player.id})">Remove</button>
          </div>
        </div>
      `;
      }).join("");
    }

    function weightedScore(player, system) {
      if (system === "4-2") {
        return player.overall * 2 + player.setting * 1.4 + player.hitting * 1.3 + player.defense + player.serveReceive + player.blocking + player.consistency;
      }

      if (system === "5-1") {
        return player.overall * 2 + player.setting * 1.8 + player.hitting + player.defense + player.serveReceive + player.blocking + player.consistency;
      }

      if (system === "6-2") {
        return player.overall * 2 + player.setting * 1.5 + player.hitting * 1.5 + player.defense + player.serveReceive + player.blocking + player.consistency;
      }

      if (system === "doubles") {
        return player.overall * 2 + player.defense * 1.5 + player.serveReceive * 1.5 + player.serving * 1.2 + player.blocking + player.athleticism * 1.2 + player.consistency;
      }

      if (system === "trios") {
        return player.overall * 2 + player.defense * 1.3 + player.serveReceive * 1.3 + player.hitting * 1.2 + player.blocking + player.setting + player.consistency;
      }

      if (system === "quads") {
        return player.overall * 2 + player.hitting * 1.3 + player.setting * 1.2 + player.defense + player.serveReceive + player.blocking + player.consistency;
      }

      return player.overall * 2 + player.hitting + player.setting + player.defense + player.serving + player.serveReceive + player.blocking + player.athleticism + player.consistency;
    }

    function generateTeams() {
      if (players.length < 2) {
        alert("Add at least 2 players.");
        return;
      }

      const system = document.getElementById("system").value;
      const teamCount = Number(document.getElementById("teamCount").value);

      if (players.length < teamCount) {
        alert("You need at least one player per team.");
        return;
      }

      const teams = Array.from({ length: teamCount }, (_, index) => ({
        name: `Team ${String.fromCharCode(65 + index)}`,
        players: [],
        score: 0,
        setters: 0,
        hitters: 0,
        defenders: 0,
        passers: 0,
        blockers: 0
      }));

      const shuffled = [...players].sort(() => Math.random() - 0.5);

      const sorted = shuffled.sort((a, b) => {
        const aSetter = detectAutoRole(a).includes("Setter") || a.setting >= 8;
        const bSetter = detectAutoRole(b).includes("Setter") || b.setting >= 8;

        if (aSetter !== bSetter) return bSetter - aSetter;

        return weightedScore(b, system) - weightedScore(a, system);
      });

      sorted.forEach(player => {
        let bestTeam;
        const autoRole = detectAutoRole(player);

        if (autoRole.includes("Setter") || player.setting >= 8) {
          bestTeam = [...teams].sort((a, b) => a.setters - b.setters || a.score - b.score)[0];
        } else if (autoRole.includes("Hitter") || autoRole.includes("Blocker") || player.hitting >= 8 || player.blocking >= 8) {
          bestTeam = [...teams].sort((a, b) => a.hitters - b.hitters || a.blockers - b.blockers || a.score - b.score)[0];
        } else if (autoRole.includes("Defense") || autoRole.includes("Passer") || player.defense >= 8 || player.serveReceive >= 8) {
          bestTeam = [...teams].sort((a, b) => a.defenders - b.defenders || a.passers - b.passers || a.score - b.score)[0];
        } else {
          bestTeam = [...teams].sort((a, b) => a.score - b.score)[0];
        }

        bestTeam.players.push(player);
        bestTeam.score += weightedScore(player, system);

        if (autoRole.includes("Setter") || player.setting >= 8) bestTeam.setters++;
        if (autoRole.includes("Hitter") || player.hitting >= 8) bestTeam.hitters++;
        if (autoRole.includes("Blocker") || player.blocking >= 8) bestTeam.blockers++;
        if (autoRole.includes("Defense") || player.defense >= 8) bestTeam.defenders++;
        if (autoRole.includes("Passer") || player.serveReceive >= 8) bestTeam.passers++;
      });

      renderTeams(teams, system);
    }

    function renderTeams(teams, system) {
      const warnings = [];

      if (system === "4-2") {
        teams.forEach(team => {
          if (team.setters < 2) warnings.push(`${team.name} has fewer than 2 setters for a 4-2.`);
        });
      }

      if (system === "5-1") {
        teams.forEach(team => {
          if (team.setters < 1) warnings.push(`${team.name} needs at least 1 setter for a 5-1.`);
        });
      }

      if (system === "6-2") {
        teams.forEach(team => {
          if (team.setters < 2) warnings.push(`${team.name} needs 2 setters for a 6-2.`);
        });
      }

      document.getElementById("warnings").innerHTML = warnings.length
        ? `<div class="warning"><strong>Balance notes:</strong><br>${warnings.join("<br>")}</div>`
        : "";

      document.getElementById("teams").innerHTML = teams.map(team => `
        <div class="team">
          <h3>${team.name}</h3>
          <p><strong>Team Score:</strong> ${team.score.toFixed(1)}</p>
          <p class="small">Setters: ${team.setters} | Hitters: ${team.hitters} | Defense: ${team.defenders} | Passers: ${team.passers} | Blockers: ${team.blockers}</p>
          <ul>
            ${team.players.map(player => `
              <li>
                <strong>${player.name}</strong>
                <span class="small">(${detectAutoRole(player)}, OVR ${Number(player.overall).toFixed(1)})</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `).join("");
    }


    window.updateOverallPreview = updateOverallPreview;
    window.savePlayerFromForm = savePlayerFromForm;
    window.cancelEdit = cancelEdit;
    window.clearPlayers = clearPlayers;
    window.editPlayer = editPlayer;
    window.removePlayer = removePlayer;
    window.generateTeams = generateTeams;

  </script>
</body>
</html>
